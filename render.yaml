# One-click deploy on Render: a Node web service.
# DATABASE_URL is optional. Left empty, Payout starts a bundled Postgres on the instance's
# disk, which Render wipes on every redeploy/restart. For data that sticks, paste your existing
# Render Postgres Internal URL (Payout keeps its tables in its own `payout` schema).
services:
  - type: web
    name: payout
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@11.21.0 install --frozen-lockfile && npx -y pnpm@11.21.0 build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
