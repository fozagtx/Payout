# One-click deploy on Render: a Node web service.
# Render's free plan allows one free Postgres per account, so DATABASE_URL is pasted in
# (an existing Render Postgres with a `payout` database, or any hosted Postgres).
services:
  - type: web
    name: payout
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@11.21.0 install --frozen-lockfile && npx -y pnpm@11.21.0 build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
